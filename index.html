<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>진격의 공시 · 행정법</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("jg.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  /* 홈은 「이거 하세요」 하나 — 모두의 통사 0919 대표님 지시. 카드·통계·목록을 다시 늘리지 않는다. */
  .exam{padding:26px 0 6px}
  .exam .k{font-size:15px;color:var(--ink-3);font-weight:700;display:flex;gap:6px;align-items:center}
  .exam .d{font-size:44px;font-weight:900;letter-spacing:-.06em;line-height:1.05;margin-top:2px}
  .exam .d small{font-size:17px;color:var(--ink-3);font-weight:700;letter-spacing:-.02em;margin-left:8px}
  .todo{margin-top:18px;padding:22px 20px;border:1.5px solid var(--ink);border-radius:var(--r3);background:var(--surface);position:relative}
  .todo h2{font-size:23px}
  .todo .t{font-size:15.5px;color:var(--ink-3);margin-top:4px}
  .todo ul{list-style:none;padding:0;margin:16px 0 18px;display:flex;flex-direction:column;gap:8px}
  .todo li{display:flex;gap:10px;align-items:baseline;font-size:16px}
  .todo li b{min-width:52px;font-weight:900}
  .todo li span{color:var(--ink-2)}
  .todo .bar{margin-bottom:16px}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .mini div{padding:12px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
  .mini b{display:block;font-size:21px;font-weight:900;letter-spacing:-.04em}
  .mini span{font-size:13px;color:var(--ink-3)}
  .alt{margin-top:28px}
  .alt h3{font-size:15px;color:var(--ink-3);margin-bottom:8px}
</style>
</head>
<body>
<div class="page">
  <div class="exam">
    <div class="k" id="ek"></div>
    <div class="d num" id="ed"></div>
  </div>

  <div class="todo" id="todo"></div>

  <div class="mini" id="mini"></div>

  <div class="alt">
    <h3>다른 걸 연습하고 싶다면</h3>
    <div class="list" id="alt"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  "use strict";
  GB.mountNav("index.html");
  var $ = function (id) { return document.getElementById(id); }, esc = GB.esc;

  var tr = GB.track(), dd = GB.dday();
  $("ek").textContent = tr.name + " 행정법";
  $("ed").innerHTML = (dd > 0 ? "D-" + dd : dd === 0 ? "D-DAY" : "시험 끝") + "<small>" + GB.goal().replace(/-/g, ".") +
    ' <span class="chip">' + GB.goalMark() + "</span></small>";

  var t = GB.today(), nm = GB.name();
  var newN = t.seq.filter(function (s) { return s.k === "ox" && !s.re; }).length;
  var prN = t.seq.filter(function (s) { return s.k === "pair"; }).length;
  var foci = t.foci.slice(0, 3).map(function (n) { return n.name; });
  var h;
  if (t.finished) {
    h = '<h2>오늘 몫 끝</h2><p class="t">' + t.total + "개를 다 했어요. 더 하고 싶으면 어려운 O·X 로 가요.</p>" +
        '<div style="margin-top:18px"><a class="btn block" href="ox.html?mode=hard">어려운 O·X</a></div>';
  } else {
    h = '<h2>' + (nm ? esc(nm) + ", " : "") + (t.done ? "이어서 " : "") + t.min + "분만 해볼까요?</h2>" +
        '<p class="t">약 ' + t.min + "분 · " + t.total + "개</p>" +
        "<ul>" +
        (t.re ? "<li><b class=\"num\">" + t.re + "개</b><span>되돌리기 — 틀렸거나 다시 볼 때가 된 문장</span></li>" : "") +
        "<li><b class=\"num\">" + newN + "개</b><span>새 문장 — " + esc(foci.join(" · ")) + "</span></li>" +
        (prN ? "<li><b class=\"num\">" + prN + "개</b><span>헷갈리는 짝</span></li>" : "") +
        "</ul>" +
        (t.done ? '<div class="bar"><i style="width:' + Math.round(t.done / t.total * 100) + '%"></i></div>' : "") +
        '<a class="btn block" href="ox.html">' + (t.done ? "이어서 · " + t.done + " / " + t.total : "시작") + "</a>";
  }
  $("todo").innerHTML = h;

  var o = GB.overall();
  $("mini").innerHTML =
    '<div><b class="num">' + GB.streak() + "일</b><span>연속</span></div>" +
    '<div><b class="num">' + GB.todayCount() + "</b><span>오늘 푼 문장</span></div>" +
    '<div><b class="num">' + o.prog + "%</b><span>전체 " + GB.num(o.n) + "문장 중</span></div>";

  var wrong = GB.wrongList().length;
  $("alt").innerHTML =
    '<a class="row" href="ox.html?mode=hard"><span class="t"><b>어려운 O·X</b><span>한두 마디만 바꾼 함정 문장</span></span><span class="go">›</span></a>' +
    '<a class="row" href="ox.html?mode=pair"><span class="t"><b>헷갈리는 짝</b><span>닮은 두 기출 문장 중 맞는 것 고르기</span></span><span class="go">›</span></a>' +
    (wrong ? '<a class="row" href="ox.html?mode=wrong"><span class="t"><b>틀린 문장 다시</b><span>' + wrong + "개</span></span><span class=\"go\">›</span></a>" : "");
})();
</script>
</body>
</html>
