<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>훈련 — 진격의 공시</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
<script>try{document.documentElement.dataset.skin=localStorage.getItem("jg.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  .hd{padding:26px 0 4px}
  .hd h1{font-size:26px}
  .hd p{color:var(--ink-3);margin:4px 0 0}
  .row .n{font-weight:900;font-size:15px;color:var(--ink-3);white-space:nowrap}
</style>
</head>
<body>
<div class="page">
  <div class="hd"><h1>훈련</h1><p>오늘 분량과 별도</p></div>
  <div class="list sec" id="ls"></div>
</div>
<script src="js/catalog.js"></script>
<script src="data/ready.js"></script>
<script src="js/boot.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  "use strict";
  GB.mountNav("drill.html");
  var S = GB.state(), done = Object.keys(S.pairs).filter(function (k) { return S.pairs[k].ok; }).length;
  var wrong = GB.wrongList().length, mis = Object.keys(S.ans).filter(function (id) { return S.ans[id].kind === "오개념"; }).length;
  var rows = [
    ["ox.html?mode=hard", "어려운 O·X", "함정 문장" + (mis ? " + 확신 오답 " + mis + "개" : ""), GB.pairs().length + "개"],
    ["ox.html?mode=pair", "헷갈리는 짝", "맞는 문장 고르기", done + " / " + GB.pairs().length],
    ["ox.html?mode=speed", "60초 스피드", "짧은 문장", "60초"],
    ["ox.html?mode=wrong", "오답 모아풀기", wrong ? "최근 오답 순" : "", wrong + "개"],
    ["skilltree.html", "쟁점 골라 풀기", "스킬트리", GB.nodes.length + "쟁점"]
  ];
  document.getElementById("ls").innerHTML = rows.map(function (r) {
    return '<a class="row" href="' + r[0] + '"><span class="t"><b>' + r[1] + "</b>" + (r[2] ? "<span>" + GB.esc(r[2]) + "</span>" : "") + '</span><span class="n num">' + r[3] + "</span></a>";
  }).join("");
})();
</script>
</body>
</html>
